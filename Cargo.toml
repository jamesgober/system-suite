# =============================================================================
#  R E P S   ·   system-suite
# =============================================================================
[package]
name    = "system-suite"
version = "0.2.0"

# Minimum Supported Rust Version (MSRV)
# 1.89: the highest MSRV among the members (sys-lib needs `File::lock` and
# `File::try_lock`, stable from 1.89.0). See dev/PLAN.md, D-004.
rust-version = "1.89"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "The foundation package for Rust services: system facts, paths, environment, configuration, logging, metrics, audit, registry, signals, and a kernel that starts and stops them in order. One dependency, one start call."

# Keywords (5 max)
keywords = ["foundation", "service", "lifecycle", "kernel", "bootstrap"]

# Categories
categories = ["config", "development-tools", "os"]

# Links
homepage      = "https://github.com/jamesgober/system-suite"
repository    = "https://github.com/jamesgober/system-suite"
documentation = "https://docs.rs/system-suite"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "system_suite"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
# Every member is behind its own feature, so a project compiles only what it
# uses. A feature whose member is not wired yet stays empty until the release
# that wires it (dev/ROADMAP.md); dev/PLAN.md section 4 lists each member.
[features]
default = ["kernel", "sys", "paths", "env", "config", "log", "metrics", "signals", "time", "ids"]

# Everything, including the opt-in members.
full = [
    "kernel", "sys", "paths", "env", "config", "log", "metrics", "signals", "time", "ids",
    "audit", "registry", "globals", "rand", "secrets",
]

# The kernel and its parts: the `kernel`, `lifecycle`, and `runtime` modules
# (stop decisions, phases, crash capture; subsystems, workers, and timers
# from 0.4).
kernel = []

# System facts and the boot kit: build info, instance info, process guard (sys-lib).
sys = ["dep:sys-lib"]

# Application and OS directories (path-lib).
paths = ["dep:path-lib"]

# Environment variables and .env files (env-lib).
env = ["paths", "dep:env-lib"]

# Configuration (config-lib, `conf` format; dev/PLAN.md, D-034). Wired in 0.4.
config = ["paths"]

# Structured logging (log-io).
log = ["dep:log-io"]

# Metrics (metrics-lib). Wired in 0.4.
metrics = []

# OS signals translated by the kernel (signal-mod).
signals = ["kernel", "dep:signal-mod"]

# Monotonic and wall-clock time, mockable (clock-lib).
time = ["dep:clock-lib"]

# Request, instance, and entity ids (id-forge).
ids = ["dep:id-forge"]

# Tamper-evident audit records (audit-trail, sha2). Opt-in: dev/PLAN.md, D-035.
audit = []

# Event and callback registry (registry-io). Opt-in until the kernel needs it.
registry = []

# Process-wide globals (global-lib).
globals = []

# Randomness, including the OS CSPRNG (mod-rand).
rand = []

# Page-locked secret storage (key-vault). Opt-in.
secrets = []

# Member features passed through (dev/PLAN.md section 12.5, D-036).
# clock-lib's serde support: `Wall` and `Monotonic` serialise.
time-serde = ["time", "clock-lib/serde"]


# DEPENDENCIES
# #################################
# Members by published version, never `path` (dev/PLAN.md, D-003). Every
# third-party crate they bring is reviewed in dev/PLAN.md section 12.4.
[dependencies]
# Build info, instance info, process guard. First-party; brings path-lib,
# clock-lib, and id-forge (all first-party, no third-party crates).
sys-lib = { version = "0.3", optional = true }

# Application directories and hardened joins; 1.1 for owner-only
# directories on every OS (`ensure_private`). First-party, no dependencies.
path-lib = { version = "1.1", optional = true }

# The .env file and typed variables. First-party; brings path-lib.
env-lib = { version = "1.0", optional = true }

# Structured logging. First-party; no dependencies with these features.
log-io = { version = "2.0", optional = true }

# Signals without an async runtime: the `agnostic` back-end only (never
# `tokio`, D-005). Brings signal-hook and libc on Unix and windows-sys on
# Windows (reviewed and accepted, dev/PLAN.md section 12.4, D-032).
signal-mod = { version = "2.0", optional = true, default-features = false, features = ["std", "agnostic"] }

# Monotonic and wall clocks, mockable. First-party, no dependencies.
clock-lib = { version = "1.1", optional = true, default-features = false, features = ["std"] }

# ULID, UUID, Snowflake, NanoID. First-party, no dependencies.
id-forge = { version = "1.0", optional = true }


# DEV DEPENDENCIES
# #################################
[dev-dependencies]


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
