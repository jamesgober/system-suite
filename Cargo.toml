# =============================================================================
#  R E P S   ·   system-suite
# =============================================================================
[package]
name    = "system-suite"
version = "0.7.0"

# Minimum Supported Rust Version (MSRV)
# 1.89: the highest MSRV among the members (sys-lib needs `File::lock` and
# `File::try_lock`, stable from 1.89.0). See dev/PLAN.md, D-004.
rust-version = "1.89"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "The foundation package for Rust services: system facts, paths, environment, configuration, logging, metrics, audit, registry, signals, and a kernel that starts and stops them in order. One dependency, one start call."

# Keywords (5 max)
keywords = ["foundation", "service", "lifecycle", "kernel", "bootstrap"]

# Categories
categories = ["config", "development-tools", "os"]

# Links
homepage      = "https://github.com/jamesgober/system-suite"
repository    = "https://github.com/jamesgober/system-suite"
documentation = "https://docs.rs/system-suite"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "system_suite"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
# Every member is behind its own feature, so a project compiles only what it
# uses. A feature whose member is not wired yet stays empty until the release
# that wires it (dev/ROADMAP.md); dev/PLAN.md section 4 lists each member.
[features]
default = ["kernel", "sys", "paths", "env", "config", "log", "metrics", "signals", "time", "ids"]

# Everything, including the opt-in members.
full = [
    "kernel", "sys", "paths", "env", "config", "log", "metrics", "signals", "time", "ids",
    "audit", "registry", "globals", "rand", "secrets",
]

# The kernel and its parts: the `kernel`, `lifecycle`, and `runtime` modules
# (stop decisions, phases, crash capture; subsystems, workers, and timers
# from 0.4).
kernel = []

# System facts and the boot kit: build info, instance info, process guard (sys-lib).
sys = ["dep:sys-lib"]

# Application and OS directories (path-lib).
paths = ["dep:path-lib"]

# Environment variables and .env files (env-lib).
env = ["paths", "dep:env-lib"]

# Configuration (config-lib, `conf` format; dev/PLAN.md, D-034).
config = ["paths", "dep:config-lib"]

# Structured logging (log-io).
log = ["dep:log-io"]

# Metrics (metrics-lib): counters, gauges, timers.
metrics = ["dep:metrics-lib"]

# OS signals translated by the kernel (signal-mod).
signals = ["kernel", "dep:signal-mod"]

# Monotonic and wall-clock time, mockable (clock-lib).
time = ["dep:clock-lib"]

# Request, instance, and entity ids (id-forge).
ids = ["dep:id-forge"]

# Tamper-evident audit records (audit-trail, sha2). Opt-in: dev/PLAN.md, D-035.
audit = ["kernel", "paths", "dep:audit-trail", "audit-trail/sha2"]

# The kernel's events delivered to callbacks (registry-io). Opt-in.
registry = ["kernel", "dep:registry-io"]

# Process-wide globals (global-lib): `system_suite::foundation()`.
globals = ["dep:global-lib"]

# Randomness, including the OS CSPRNG (mod-rand); boot step 2 checks the
# OS source works.
rand = ["dep:mod-rand"]

# Secret references in the configuration (`env:`, `file:`, `vault:`)
# resolved into a page-locked vault (key-vault). Opt-in.
secrets = ["kernel", "config", "rand", "dep:key-vault"]

# Member features passed through (dev/PLAN.md section 12.5, D-036).
# clock-lib's serde support: `Wall` and `Monotonic` serialise.
time-serde = ["time", "clock-lib/serde"]
# metrics-lib's histogram and summary.
metrics-histogram = ["metrics", "metrics-lib/histogram"]
# metrics-lib's rate meter.
metrics-meter = ["metrics", "metrics-lib/meter"]
# metrics-lib's StatsD and DogStatsD exporter (std only).
metrics-statsd = ["metrics", "metrics-lib/statsd"]
# metrics-lib's blocking `/metrics` server and Pushgateway client (std only).
metrics-http = ["metrics", "metrics-lib/http"]
# Accepted into the dependency register by James on 2026-10-28 (dev/PLAN.md,
# D-056); each is opt-in.
# log-io's `log` bridge: records from crates that use the `log` facade go to
# the suite's logger. Brings `log`.
log-bridge = ["log", "log-io/log"]
# log-io's `tracing` layer: a `tracing` subscriber that writes through
# log-io. Brings `tracing-core` and `tracing-subscriber`.
log-tracing = ["log", "log-io/tracing"]
# metrics-lib's `tracing` integration. Brings `tracing`.
metrics-tracing = ["metrics", "metrics-lib/tracing"]
# config-lib's TOML format (through noml): `<name>.toml`. Brings `noml`.
config-toml = ["config", "config-lib/toml"]
# config-lib's NOML format: `<name>.noml`. Brings `noml`.
config-noml = ["config", "config-lib/noml"]
# audit-trail's BLAKE3 hasher (`[audit] hash = "blake3"`). Brings blake3
# (in the register, section 12.4).
audit-blake3 = ["audit", "audit-trail/blake3"]


# DEPENDENCIES
# #################################
# Members by published version, never `path` (dev/PLAN.md, D-003). Every
# third-party crate they bring is reviewed in dev/PLAN.md section 12.4.
[dependencies]
# Build info, instance info, process guard. First-party; brings path-lib,
# clock-lib, and id-forge (all first-party, no third-party crates).
sys-lib = { version = "0.3", optional = true }

# Application directories and hardened joins; 1.1 for owner-only
# directories on every OS (`ensure_private`). First-party, no dependencies.
path-lib = { version = "1.1", optional = true }

# The .env file and typed variables. First-party; brings path-lib.
env-lib = { version = "1.0", optional = true }

# Configuration in the `conf` format. First-party; brings thiserror, serde,
# dashmap, and arc-swap (reviewed and accepted, dev/PLAN.md section 12.4).
# Default features off: `hot-reload` brings `notify` (not accepted).
config-lib = { version = "1.1", optional = true, default-features = false, features = ["conf"] }

# Structured logging; 2.1 for the recent-lines ring (crash reports) and
# file modes. First-party; no dependencies with these features.
log-io = { version = "2.1", optional = true }

# The audit chain; 1.1 for verified open and resume, owner-only files,
# sync, and a clock that never goes back. Brings sha2 (in the register).
audit-trail = { version = "1.1", optional = true, default-features = false, features = ["std"] }

# Kernel events to callbacks, with panic isolation. First-party, no
# dependencies with `sync` only (`async` would bring futures-core).
registry-io = { version = "1.1", optional = true, default-features = false, features = ["sync"] }

# Process-wide typed values. First-party, no dependencies.
global-lib = { version = "1.0", optional = true }

# Tiered randomness: the OS CSPRNG and process-unique values. First-party,
# no dependencies.
mod-rand = { version = "1.0", optional = true, default-features = false, features = ["std", "tier2", "tier3"] }

# Page-locked, wiped-on-drop secret storage. First-party; brings subtle,
# getrandom, blake3, zeroize, and arc-swap (in the register). Its file
# fetcher is not used: the suite checks secret files itself.
key-vault = { version = "1.1", optional = true, default-features = false, features = ["std", "fragment-standard", "decoy-self-ref"] }

# Metrics. First-party; no dependencies with these features. `system`
# (process metrics) is off: it brings sysinfo on the BSDs, not yet reviewed.
metrics-lib = { version = "2.0", optional = true, default-features = false, features = ["count", "gauge", "timer"] }

# Signals without an async runtime: the `agnostic` back-end only (never
# `tokio`, D-005). Brings signal-hook and libc on Unix and windows-sys on
# Windows (reviewed and accepted, dev/PLAN.md section 12.4, D-032).
signal-mod = { version = "2.1", optional = true, default-features = false, features = ["std", "agnostic", "service"] }

# Monotonic and wall clocks, mockable. First-party, no dependencies.
clock-lib = { version = "1.1", optional = true, default-features = false, features = ["std"] }

# ULID, UUID, Snowflake, NanoID. First-party, no dependencies.
id-forge = { version = "1.0", optional = true }


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
# The `log` facade, to test `log-bridge` (accepted, D-056).
log = { version = "0.4", default-features = false, features = ["std"] }

# Model tests of the urgent line and worker heartbeats, compiled only with
# `RUSTFLAGS="--cfg loom"` (D-056). Development only; never in a build of
# the crate.
[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }


# BENCHMARKS
# #################################
# The boot benchmark harness (D-068): std only, `harness = false`.
[[bench]]
name = "boot"
harness = false
required-features = ["kernel", "sys", "paths", "config", "log"]


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
